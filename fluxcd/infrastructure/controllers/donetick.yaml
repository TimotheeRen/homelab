apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: donetick
  namespace: default
spec:
  interval: 5m
  url: donetick-chart https://rtomik.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: donetick
  namespace: default
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: donetick
      version: '1.0.6'
      sourceRef:
        kind: HelmRepository
        name: donetick
        namespace: default
      interval: 10m
